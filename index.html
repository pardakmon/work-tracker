<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>근태 기록 보고서</title>
    <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
    <div class="container">
        <!-- 인쇄/PDF 저장 시에만 보이는 공식 문서 헤더 -->
        <div class="print-only-header">
            <h1>근무 상황 및 근태 기록 보고서</h1>
            <p id="print-shift-period"></p>
        </div>

        <h2 class="no-print">근태 상태 기록</h2>

        <!-- 카메라 촬영 및 미리보기 영역 (인쇄 시 숨김) -->
        <div class="camera-box no-print">
            <input type="file" id="camera-input" accept="image/*" capture="environment" hidden>
            <button id="btn-camera" class="btn-cam">📷 빈자리/현장 사진 첨부 (선택)</button>
            <div id="preview-container" style="display: none;">
                <img id="photo-preview" src="" alt="미리보기">
                <button id="btn-clear-photo" class="btn-small">사진 취소</button>
            </div>
        </div>
        
        <!-- 상태 기록 버튼 영역 (인쇄 시 숨김) -->
        <div class="btn-grid no-print">
            <button id="btn-return" class="btn blue">업무 시작 / 자리 복귀</button>
            <button id="btn-bed" class="btn red">대기실 누움</button>
            <button id="btn-avoid" class="btn orange">전화 회피</button>
            <button id="btn-out" class="btn gray">외출 / 기타 이탈</button>
        </div>

        <!-- 24시간 근무일(09:00 ~ 익일 09:00) 누적 시간 요약 영역 -->
        <div class="summary-box">
            <div class="summary-title">
                <span>📊 근무일 누적 집계</span>
                <small id="shift-range-label">09:00 ~ 익일 09:00</small>
            </div>
            <div class="summary-grid">
                <div class="stat-card office">
                    <span class="stat-label">사무실 근무</span>
                    <strong id="stat-office">0분</strong>
                </div>
                <div class="stat-card bed">
                    <span class="stat-label">대기실 누움</span>
                    <strong id="stat-bed">0분</strong>
                </div>
                <div class="stat-card out">
                    <span class="stat-label">외출/이탈</span>
                    <strong id="stat-out">0분</strong>
                </div>
                <div class="stat-card avoid">
                    <span class="stat-label">전화 회피</span>
                    <strong id="stat-avoid">0회</strong>
                </div>
            </div>
        </div>

        <!-- 기록 조회 및 내보내기 영역 -->
        <div id="log-area">
            <div class="log-header">
                <h3>상세 타임라인</h3>
                <div class="controls no-print">
                    <input type="date" id="date-picker" title="근무 시작일(09:00 기준) 선택">
                    <button id="btn-pdf" class="btn-pdf">PDF 저장</button>
                    <button id="btn-export" class="btn-export">엑셀</button>
                </div>
            </div>
            <ul id="log-list">
                <li>기록을 불러오는 중...</li>
            </ul>
        </div>
    </div>

    <script type="module" src="app.js?v=3"></script>
</body>
</html>
