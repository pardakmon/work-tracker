<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>근태 기록</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>근태 상태 기록</h2>

        <!-- 카메라 촬영 및 미리보기 영역 -->
        <div class="camera-box">
            <input type="file" id="camera-input" accept="image/*" capture="environment" hidden>
            <button id="btn-camera" class="btn-cam">📷 빈자리/현장 사진 첨부 (선택)</button>
            <div id="preview-container" style="display: none;">
                <img id="photo-preview" src="" alt="미리보기">
                <button id="btn-clear-photo" class="btn-small">사진 취소</button>
            </div>
        </div>
        
        <!-- 상태 기록 버튼 영역 -->
        <div class="btn-grid">
            <button id="btn-return" class="btn blue">업무 시작 / 자리 복귀</button>
            <button id="btn-bed" class="btn red">대기실 누움</button>
            <button id="btn-avoid" class="btn orange">전화 회피</button>
            <button id="btn-out" class="btn gray">외출 / 기타 이탈</button>
        </div>

        <!-- 기록 조회 및 내보내기 영역 -->
        <div id="log-area">
            <div class="log-header">
                <h3>기록 타임라인</h3>
                <div class="controls">
                    <input type="date" id="date-picker">
                    <button id="btn-export" class="btn-export">엑셀 저장</button>
                </div>
            </div>
            <ul id="log-list">
                <li>기록을 불러오는 중...</li>
            </ul>
        </div>
    </div>

    <script type="module" src="app.js?v=2"></script>
</body>
</html>
